name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release commit
    uses: ./.github/workflows/test.yml
    with:
      force: true
    permissions:
      contents: read
      pull-requests: read

  release:
    name: build and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3." >&2
            exit 1
          fi

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          release_flags=()
          version_without_metadata=${RELEASE_TAG%%+*}
          if [[ "$version_without_metadata" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" \
            dist/setup-ssh-key_linux_amd64.tar.gz \
            dist/setup-ssh-key_linux_arm64.tar.gz \
            dist/setup-ssh-key_darwin_amd64.tar.gz \
            dist/setup-ssh-key_darwin_arm64.tar.gz \
            dist/setup-ssh-key_windows_amd64.zip \
            dist/setup-ssh-key_windows_arm64.zip \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "${release_flags[@]}"
