name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tagged commit already passed Validate on main, so do not test it again.
  gate:
    name: Require main Validate
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require the tagged commit to be on main and validated
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GH_REPO" --jq .default_branch)"
          relation="$(gh api "repos/$GH_REPO/compare/$default_branch...$RELEASE_SHA" --jq .status)"
          if [[ "$relation" != identical && "$relation" != behind ]]; then
            echo "::error::$RELEASE_SHA is not on $default_branch; tag a commit that main has validated"
            exit 1
          fi
          # Validate may still be starting or running when the tag is pushed
          # right after the merge, so poll briefly.
          for attempt in $(seq 10); do
            result="$(
              gh api "repos/$GH_REPO/commits/$RELEASE_SHA/check-runs?check_name=Validate" \
                --jq '.check_runs | sort_by(.started_at) | last | if . == null then "missing" else "\(.status) \(.conclusion)" end'
            )"
            case "$result" in
              "completed success")
                echo "Validate passed on $RELEASE_SHA"
                exit 0
                ;;
              completed*)
                echo "::error::Validate finished as '${result#completed }' on $RELEASE_SHA"
                exit 1
                ;;
            esac
            # A missing run is pending: CI on main may not have started yet.
            echo "Validate has not finished on $RELEASE_SHA ($result, check $attempt of 10)"
            sleep 30
          done
          echo "::error::No successful Validate on $RELEASE_SHA within 5 minutes. Tag a commit whose CI on main has run, or re-run this workflow once it finishes."
          exit 1

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v1.2.3." >&2
            exit 1
          fi

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          release_flags=()
          version_without_metadata=${RELEASE_TAG%%+*}
          if [[ "$version_without_metadata" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi

          gh release create "$RELEASE_TAG" \
            dist/setup-ssh-key_linux_amd64.tar.gz \
            dist/setup-ssh-key_linux_arm64.tar.gz \
            dist/setup-ssh-key_darwin_amd64.tar.gz \
            dist/setup-ssh-key_darwin_arm64.tar.gz \
            dist/setup-ssh-key_windows_amd64.zip \
            dist/setup-ssh-key_windows_arm64.zip \
            dist/checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            "${release_flags[@]}"
