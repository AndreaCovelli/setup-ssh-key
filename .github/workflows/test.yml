name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - name: Check
        id: check
        uses: AndreaCovelli/repo-baseline/.github/actions/check@8aafc69756399d1cc08b1ddbf79d19af74378eca # v1.1.2
        with:
          paths: |
            **/*.go
            go.mod
            go.sum
            mise.toml
            mise.lock
            scripts/**
            .github/workflows/**
          setup-task: setup
          cache-path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          cache-key-files: |
            go.sum
            go.mod
            mise.lock

  # These jobs start only when the Linux check ran: a no-op push, or a push
  # whose tree a pull request already validated, never reaches them. Dependency
  # update PRs run them too, because their push to main reuses the PR result.
  portability:
    name: portability (${{ matrix.os }})
    needs: check
    if: ${{ needs.check.outputs.relevant == 'true' }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build
        run: go build .

  validate:
    name: Validate
    needs: [check, portability]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
