name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      force:
        description: Run all checks regardless of changed paths
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: validate
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      force: ${{ inputs.force == true }}
      timeout-minutes: 20
      paths: |
        **/*.go
        go.mod
        mise.toml
        mise.lock
        scripts/**
        .github/workflows/**
      cache-path: |
        ~/go/pkg/mod
        ~/.cache/go-build
      cache-key-files: |
        go.sum
        go.mod
        mise.lock

  portability:
    name: portability (${{ matrix.os }})
    # macOS and Windows minutes are billed at a multiple of Linux. Dependency
    # update PRs skip them; the push to main after merge still runs both.
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push comparisons need the previous commit without an authenticated fetch.
          fetch-depth: 0
          persist-credentials: false

      # A force push discards the previous head, so there is nothing to compare
      # against: run every check instead, as for manual runs.
      - name: Detect validation-relevant changes
        if: ${{ !inputs.force && !github.event.forced && github.event_name != 'workflow_dispatch' }}
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            validation:
              - "**/*.go"
              - "go.mod"
              - "scripts/**"
              - ".github/workflows/**"

      - name: Set up Go
        if: steps.changes.outcome == 'skipped' || steps.changes.outputs.validation == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        if: steps.changes.outcome == 'skipped' || steps.changes.outputs.validation == 'true'
        run: go test ./...

      - name: Build
        if: steps.changes.outcome == 'skipped' || steps.changes.outputs.validation == 'true'
        run: go build .

  validate:
    name: Validate
    needs: [check, portability]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
