[settings]
lockfile = true

[tools]
actionlint = "1.7.12"
go = "1.27.1"
"go:golang.org/x/tools/cmd/deadcode" = "v0.50.0"
"go:golang.org/x/tools/cmd/goimports" = "v0.50.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.8.0"
shellcheck = "0.11.0"
staticcheck = "2026.2.1"

[tasks.build]
description = "Build the setup-ssh-key binary"
run = "go build -trimpath ."

[tasks.test]
description = "Run the test suite with the race detector"
run = "go test -race ./..."

[tasks.format]
description = "Format tracked Go files and organize imports"
run = "git ls-files -z '*.go' | xargs -0 goimports -w"

[tasks."check:mod"]
description = "Check that Go module files are tidy"
run = "go mod tidy -diff"

[tasks."check:format"]
description = "Check Go formatting and imports"
run = '''
unformatted="$(git ls-files -z '*.go' | xargs -0 goimports -l)"
if [ -n "$unformatted" ]; then
  printf '%s\n' "$unformatted"
  exit 1
fi
'''

[tasks."check:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."check:shell"]
description = "Lint shell scripts"
run = "shellcheck scripts/*.sh"

[tasks."check:vet"]
description = "Run go vet"
run = "go vet ./..."

[tasks."check:static"]
description = "Run staticcheck"
run = "staticcheck ./..."

[tasks."check:vuln"]
description = "Check for reachable Go vulnerabilities"
run = "govulncheck ./..."

[tasks."check:deadcode"]
description = "Check for unreachable Go code"
run = "deadcode -test ./..."

[tasks.check]
description = "Run all repository checks"
run = [
  { task = "check:mod" },
  { task = "check:format" },
  { task = "check:actions" },
  { task = "check:shell" },
  { task = "test" },
  { task = "check:vet" },
  { task = "check:static" },
  { task = "check:vuln" },
  { task = "check:deadcode" },
  { task = "build" },
]
